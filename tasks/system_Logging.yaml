# 6.1.1.1, 6.1.1.4 Configure journald

- name: Uninstall non-selected logger package(s)
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop:
    - rsyslog
    - journald
  when: item != preferred_logger

- name: Install selected logger package(s)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - rsyslog
    - journald
  when: item == preferred_logger

- name: Enable and start journald if selected
  ansible.builtin.systemd:
    name: systemd-journald
    enabled: yes
    state: started
  when: preferred_logger == "journald"

- name: Disable and stop rsyslog if journald is preferred
  ansible.builtin.systemd:
    name: rsyslog
    enabled: false
    state: stopped
  when: preferred_logger == "journald"

- name: Enable and start rsyslog if selected
  ansible.builtin.systemd:
    name: rsyslog
    enabled: yes
    state: started
  when: preferred_logger == "rsyslog"
  
# # 6.1.2.1.1 Ensure systemd-journal-remote is installed
- name: Ensure systemd-journal-remote is installed
  ansible.builtin.apt:
    name: systemd-journal-remote
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

# # # 6.1.2.1.3 Ensure systemd-journal-upload is enabled and active
- name: Unmask systemd-journal-upload.service
  ansible.builtin.command: systemctl unmask systemd-journal-upload.service
  changed_when: true

- name: Enable and start systemd-journal-upload.service
  ansible.builtin.systemd:
    name: systemd-journal-upload.service
    enabled: yes
    state: started

# # # 6.1.2.1.4 Ensure systemd-journal-remote service is not in use
- name: Stop systemd-journal-remote.socket and service
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service

- name: Mask systemd-journal-remote.socket and service
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: yes
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service

# # # 6.1.2.2 Ensure journald ForwardToSyslog is disabled
- name: Ensure ForwardToSyslog is set to no in journald.conf
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?ForwardToSyslog='
    line: 'ForwardToSyslog=no'
    state: present
  notify: Restart systemd-journald
  when: preferred_logger == "journald"

- name: Copy systemd.conf to /etc/tmpfiles.d if journald is preferred
  ansible.builtin.copy:
    src: /usr/lib/tmpfiles.d/systemd.conf
    dest: /etc/tmpfiles.d/systemd.conf
    owner: root
    group: root
    mode: '0640'
  when: preferred_logger == "journald"

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted


# # # 6.1.2.3 Configure journald log compression
- name: Configure journald log rotation settings
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    state: present
  loop:
    - { key: 'SystemMaxUse', value: '500M' }
    - { key: 'SystemKeepFree', value: '100M' }
    - { key: 'RuntimeMaxUse', value: '10M' }
    - { key: 'RuntimeKeepFree', value: '200M' }
    - { key: 'MaxFileSec', value: '1month' }
    - { key: 'ForwardToSyslog', value: 'no' }
    - { key: 'Storage', value: 'persistent' }
    - { key: 'Compress', value: 'yes' }
  notify: Restart systemd-journald


# # # 6.1.2.4 Ensure journald Storage is configured
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/
    state: directory
    mode: '0755'

- name: Configure Storage=persistent for systemd-journald
  ansible.builtin.blockinfile:
    path: /etc/systemd/journald.conf.d/60-journald.conf
    create: yes
    block: |
      [Journal]
      Storage=persistent
  notify: Restart systemd-journald

# # # 6.1.3.3 - Ensure journald forwards logs to rsyslog
- name: Ensure journald forwards logs to rsyslog
  block:

    - name: Ensure journald drop-in config directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'

    - name: Ensure ForwardToSyslog=yes is configured in journald drop-in
      ansible.builtin.blockinfile:
        path: /etc/systemd/journald.conf.d/60-journald.conf
        create: yes
        block: |
          [Journal]
          ForwardToSyslog=yes

    - name: Reload systemd-journald to apply changes
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted

# # # 6.1.3.4 - Ensure rsyslog log file creation mode is configured
- name: Ensure rsyslog uses restrictive file creation mode
  block:

    - name: Ensure rsyslog drop-in config directory exists
      ansible.builtin.file:
        path: /etc/rsyslog.d
        state: directory
        mode: '0755'

    - name: Set $FileCreateMode to 0640 in drop-in config
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.d/60-rsyslog.conf
        create: yes
        line: '$FileCreateMode 0640'
        state: present

    - name: Reload rsyslog service to apply changes
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
      when: preferred_logger == 'rsyslog'

# # # 6.1.3.7 - Ensure rsyslog is not configured to receive logs from remote clients
- name: Get rsyslog config files
  ansible.builtin.find:
    paths:
      - /etc/rsyslog.conf
      - /etc/rsyslog.d/
    patterns: '*.conf'
    recurse: no
  register: rsyslog_conf_files

- name: Define list of regex patterns to remove
  ansible.builtin.set_fact:
    rsyslog_remove_patterns:
      - '^\\s*module\\s*\\(\\s*load\\s*=\\s*\\"imtcp\\"\\s*\\)'
      - '^\\s*input\\s*\\(\\s*type\\s*=\\s*\\"imtcp\\".*port\\s*=\\s*\\"?514\\"?.*\\)'
      - '^\\s*\\$ModLoad\\s+imtcp'
      - '^\\s*\\$InputTCPServerRun'

- name: Remove insecure rsyslog TCP config lines
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    state: absent
    regexp: "{{ item.1 }}"
  loop: "{{ rsyslog_conf_files.files | map(attribute='path') | list | product(rsyslog_remove_patterns) | list }}"
  loop_control:
    label: "{{ item.0 }} => {{ item.1 }}"

# # # 6.1.4.1 - Ensure access to all logfiles has been configured
- name: Copy log permission check script from template
  ansible.builtin.template:
    src: check_log_permissions.sh.j2
    dest: /usr/local/bin/check_log_permissions.sh
    mode: '0750'
    owner: root
    group: root

- name: Ensure correct permissions and ownership for /var/log files
  ansible.builtin.command: /usr/local/bin/check_log_permissions.sh
  become: true
  register: log_check_result
  changed_when: log_check_result.stdout != ""
  failed_when: false
