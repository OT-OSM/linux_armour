    # -------------------------------
    # /etc/issue.net setup
    # -------------------------------
    - name: Ensure /etc/issue.net exists with legal notice
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: |
          Authorized users only. All activity may be monitored and reported.
        owner: root
        group: root
        mode: '0644'
        force: yes
      # Explanation:
      # This task ensures that /etc/issue.net contains the legal notice.
      # Ownership is set to root:root and permissions to 0644.
      # 'force: yes' ensures that existing content is overwritten if needed.

    # -------------------------------
    # /etc/issue setup (optional)
    # -------------------------------
    - name: Ensure /etc/issue exists with default notice
      ansible.builtin.copy:
        dest: /etc/issue
        content: |
          Authorized users only. All activity may be monitored and reported.
        owner: root
        group: root
        mode: '0644'
      ignore_errors: yes
      # Explanation:
      # This task sets the /etc/issue banner with a legal notice.
      # If the file does not exist, task is skipped due to ignore_errors.

    # -------------------------------
    # /etc/motd setup
    # -------------------------------
    - name: Ensure /etc/motd exists (empty if not present)
      ansible.builtin.file:
        path: /etc/motd
        state: touch
        owner: root
        group: root
        mode: '0644'
      # Explanation:
      # Ensures /etc/motd file exists. If not, it is created empty.
      # Ownership is root:root and permissions are 0644.

    # -------------------------------
    # Ownership & permission enforcement
    # -------------------------------
    - name: Set ownership and permissions for /etc/motd if it exists
      file:
        path: /etc/motd
        owner: root
        group: root
        mode: '0644'
      # Explanation:
      # Re-applies correct ownership and permissions for /etc/motd.

    - name: Set ownership and permissions for /etc/issue if it exists
      file:
        path: /etc/issue
        owner: root
        group: root
        mode: '0644'
      # Explanation:
      # Ensures /etc/issue has correct ownership and permissions.

    - name: Set ownership and permissions for /etc/issue.net if it exists
      file:
        path: /etc/issue.net
        owner: root
        group: root
        mode: '0644'
      # Explanation:
      # Ensures /etc/issue.net has correct ownership and permissions.

    # -------------------------------
    # Debug if /etc/issue.net missing
    # -------------------------------
    - name: Show message if /etc/issue.net not found
      debug:
        msg: "/etc/issue.net file not found on this system"
      # Explanation:
      # Prints a debug message if /etc/issue.net does not exist.

