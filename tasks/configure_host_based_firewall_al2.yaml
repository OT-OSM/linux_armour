---
- name: Ensure iptables is installed
  become: true
  ansible.builtin.package:
    name:
      - iptables
    state: present

- name: Detect installed firewall utilities
  ansible.builtin.package_facts:
    manager: auto

- name: Set detected_firewalls fact
  ansible.builtin.set_fact:
    detected_firewalls: >-
      {{
        [
          'firewalld' if 'firewalld' in ansible_facts.packages else None,
          'nftables' if 'nftables' in ansible_facts.packages else None,
          'iptables-services' if 'iptables-services' in ansible_facts.packages else None
        ] | reject('none') | list
      }}

- name: Show detected firewall utilities
  ansible.builtin.debug:
    msg: "Detected firewall utilities: {{ detected_firewalls }}"

- name: Prompt user when MULTIPLE firewalls detected
  ansible.builtin.pause:
    prompt: "Multiple firewalls detected: {{ detected_firewalls }}. Select firewall (firewalld / nftables / iptables-services):"
  register: firewall_input
  when: detected_firewalls | length > 1

- name: Prompt user when NO firewall detected
  ansible.builtin.pause:
    prompt: "No firewall detected. Select firewall to configure (firewalld / nftables / iptables-services):"
  register: firewall_input
  when: detected_firewalls | length == 0

- name: Set selected_firewall from user input
  ansible.builtin.set_fact:
    selected_firewall: "{{ firewall_input.user_input }}"
  when: detected_firewalls | length != 1

- name: Auto-select detected firewall
  ansible.builtin.set_fact:
    selected_firewall: "{{ detected_firewalls[0] }}"
  when: detected_firewalls | length == 1

- name: Debug auto-selection result
  ansible.builtin.debug:
    msg: "Auto-selected firewall because exactly one was detected: {{ selected_firewall }}"
  when: detected_firewalls | length == 1

- name: Show selected firewall
  ansible.builtin.debug:
    msg: "Selected firewall: {{ selected_firewall }}"

- name: Ensure only one firewall configuration utility is active
  block:

    - name: Gather installed firewall packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Get list of all systemd service units
      ansible.builtin.command: systemctl list-unit-files --type=service --no-legend --no-pager
      register: systemd_units
      changed_when: false
      failed_when: false

    - name: Get active firewall services
      ansible.builtin.shell: |
        systemctl list-units --type=service --state=active | grep -E 'firewalld|nftables|iptables' | awk '{print $1}'
      register: active_firewall_services
      changed_when: false
      failed_when: false

    - name: Show active firewall services
      ansible.builtin.debug:
        msg: "Active firewall services: {{ active_firewall_services.stdout_lines }}"

    - name: Configure Firewalld as active firewall
      when: selected_firewall == "firewalld"
      block:

        - name: FIREWALLD | Action summary
          ansible.builtin.debug:
            msg: "Configuring Firewalld → Removing nftables & iptables-services"

        - name: Remove conflicting packages for Firewalld
          ansible.builtin.package:
            name: "{{ firewalld_conflict_packages }}"
            state: absent
          ignore_errors: true

        - name: FIREWALLD | Stop & mask conflicting services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            masked: true
          loop: "{{ firewalld_conflict_services }}"
          when: item + '.service' in systemd_units.stdout

    - name: Configure NFTables as active firewall
      when: selected_firewall == "nftables"
      block:

        - name: NFTABLES | Action summary
          ansible.builtin.debug:
            msg: "Configuring NFTables → Removing firewalld & iptables-services"

        - name: Remove conflicting packages for NFTables
          ansible.builtin.package:
            name: "{{ nftables_conflict_packages }}"
            state: absent
          ignore_errors: true

        - name: NFTABLES | Stop & mask conflicting services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            masked: true
          loop: "{{ nftables_conflict_services }}"
          when: item + '.service' in systemd_units.stdout

    - name: Configure IPTables as active firewall
      when: selected_firewall == "iptables-services"
      block:

        - name: IPTABLES | Action summary
          ansible.builtin.debug:
            msg: "Configuring IPTables → Removing firewalld & nftables"

        - name: Remove conflicting packages for IPTables
          ansible.builtin.package:
            name: "{{ iptables_conflict_packages }}"
            state: absent
          ignore_errors: true

        - name: IPTABLES | Stop & mask conflicting services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            masked: true
          loop: "{{ iptables_conflict_services }}"
          when: item + '.service' in systemd_units.stdout

- name: Include Firewalld specific tasks
  ansible.builtin.include_tasks: configure_firewalld_al2.yaml
  when: selected_firewall == "firewalld"

- name: Include NFTables specific tasks
  ansible.builtin.include_tasks: configure_nftables_al2.yaml
  when: selected_firewall == "nftables"

- name: Include IPTables specific tasks
  ansible.builtin.include_tasks: configure_iptables_al2.yaml
  when: selected_firewall == "iptables-services"

