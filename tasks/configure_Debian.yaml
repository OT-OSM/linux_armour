---
- name: Update cache
  ansible.builtin.apt:
    update_cache: true

# 4 Firewall Configuration
- name: Network Parameters For Host
  include_tasks: firewall_Configuration.yaml

# 5.1 SSH Control Configuration
- name: Access Control Configuration
  include_tasks: ssh_Configuration.yaml

# 5.2 Control Configuration
- name: Access Control Configuration
  include_tasks: access_Control.yaml

# 5.3 Control Configuration
- name: pluggable_Notification Access Control Configuration
  include_tasks: pluggable_Authentication.yaml

# 5.4 Configure user account and environment
- name: Configure user account and environment
  include_tasks: user_Account_Environments.yaml

# 6.1 System Logging Configuration
- name: Ensure filesystem integrity is regularly checked
  include_tasks: system_Logging.yaml

# 6.2 Configure System Accounting
- name: Configure System Accounting
  include_tasks: audit.yaml

# 6.3 Filesystem Integrity Checking
- name: Ensure filesystem integrity is regularly checked
  include_tasks: filesystem_Integrity.yaml
  when: cis_Stage > 1

# 7.1 Set System File Permission
- name: Configure System files
  include_tasks: system_file_permission.yaml
