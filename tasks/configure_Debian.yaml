---
################################
###### Configure Firewall ######
################################
- name: Network Parameters For Host
  ansible.builtin.include_tasks: firewall_Configuration.yaml

##############################################################
###### Configure Pluggable Authentication Modules (PAM) ######
##############################################################
- name: pluggable_Notification Access Control Configuration
  ansible.builtin.include_tasks: pam_{{ ansible_os_family }}.yaml

####################################################
###### Configure User Account AND ENVIRONMENT ######
####################################################
- name: Configure user account and environment
  include_tasks: user_Account_Environments.yaml

####################################################
###### Configure System Logging ######
####################################################
- name: Ensure filesystem integrity is regularly checked
  ansible.builtin.include_tasks: system_Logging.yaml

- name: Configure System Accounting
  include_tasks: audit.yaml

- name: Ensure filesystem integrity is regularly checked
  include_tasks: filesystem_Integrity.yaml
  when: cis_Stage > 1

- name: Configure System files
  include_tasks: system_file_permissions.yaml
