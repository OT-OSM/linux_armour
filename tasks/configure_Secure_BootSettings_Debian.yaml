############################
# 1.3 Configure AppArmor #
############################

# 1.3.1.1 Ensure AppArmor is installed
- name: Ensure AppArmor is installed
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  register: apparmor_installed
  with_items:
    - apparmor
    - apparmor-utils
  until: apparmor_installed is succeeded
  retries: 3
  delay: 5

- name: Check if AppArmor kernel module is enabled
  ansible.builtin.command: cat /sys/module/apparmor/parameters/enabled
  register: apparmor_enabled
  ignore_errors: true
  changed_when: false

- name: Set fact if AppArmor kernel support is active
  ansible.builtin.set_fact:
    apparmor_active: "{{ apparmor_enabled.stdout | trim == 'Y' }}"

- name: Ensure AppArmor service is enabled and running
  ansible.builtin.service:
    name: apparmor
    enabled: true
    state: started
  when: apparmor_active | bool

- name: Enforce all AppArmor profiles
  ansible.builtin.command: aa-enforce /etc/apparmor.d/*
  register: apparmor_enforce
  changed_when: "'Enforcing' in apparmor_enforce.stdout"
  failed_when: false
  when: apparmor_active | bool

# 1.3.1.2 Ensure AppArmor is enabled in the bootloader configuration
# Optional step: For on-premise only, if AppArmor kernel not active
- name: Ensure AppArmor is enabled in bootloader (on-prem only)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="apparmor=1 security=apparmor"'
    create: yes
    backup: yes
  notify: Update Grub Configuration
  when:
    - not apparmor_active | bool
    - ansible_virtualization_type not in ['kvm', 'xen', 'amazon', 'aws', 'hyperv']

############################
# 1.4 Configure BootLoader #
############################

# 1.4.1 Ensure bootloader password is set
- name: Configure bootloader password (only where required)
  when: grub_password_required | bool
  block:
    - name: Check if bootloader password already configured
      ansible.builtin.shell: grep -q "password_pbkdf2 root" /etc/grub.d/40_custom
      register: grub_password_exists
      changed_when: false
      failed_when: false

    - name: Generate PBKDF2 password hash
      when: grub_password_exists.rc != 0
      ansible.builtin.expect:
        command: grub-mkpasswd-pbkdf2
        responses:
          Enter password: "{{ root_password }}"
          Reenter password: "{{ root_password }}"
      register: password_hash

    - name: Extract PBKDF2 hash
      when: grub_password_exists.rc != 0
      ansible.builtin.set_fact:
        pbkdf2_hash: "{{ password_hash.stdout | regex_search('PBKDF2 hash of your password is (.*)', '\\1') | first }}"

    - name: Update bootloader configuration
      when: grub_password_exists.rc != 0
      ansible.builtin.blockinfile:
        path: /etc/grub.d/40_custom
        block: |
          set superusers="root"
          password_pbkdf2 root {{ pbkdf2_hash }}
        insertbefore: '^exit 0'
        create: yes
      notify: Update Grub Configuration

# 1.4.2 Ensure permissions on bootloader config are configured
- name: Check if grub bootloader file exists
  ansible.builtin.stat:
    path: /boot/grub/grub.cfg
  register: grub_cfg_stat

- name: Set permissions on grub configuration
  ansible.builtin.file:
    path: /boot/grub/grub.cfg
    owner: root
    group: root
    mode: "0600"
    state: file
  when: grub_cfg_stat.stat.exists
