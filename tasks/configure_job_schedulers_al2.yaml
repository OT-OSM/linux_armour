---
# Ensure cron daemon is enabled and active
- name: Ensure cron daemon is enabled and active
  ansible.builtin.systemd:
    name: "{{ cron_service }}"
    masked: no
    enabled: true
    state: started
  become: true

# Ensure cron directories permissions are configured
- name: Ensure permissions on cron directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "{{ cron_dir_mode }}"
  loop: "{{ cron_dirs }}"
  become: true

# Ensure permissions on /etc/crontab are configured
- name: Ensure permissions on crontab file
  ansible.builtin.file:
    path: "{{ cron_tab_file }}"
    owner: root
    group: root
    mode: "{{ cron_tab_mode }}"
  become: true

# Ensure /etc/cron.allow exists and is secured
- name: Ensure /etc/cron.allow exists and is secured
  ansible.builtin.file:
    path: "{{ cron_allow_file }}"
    state: touch
    owner: root
    group: root
    mode: "{{ cron_allow_mode }}"
  become: true

# Check if /etc/cron.deny exists
- name: Check if /etc/cron.deny exists
  ansible.builtin.stat:
    path: "{{ cron_deny_file }}"
  register: cron_deny_status

# Ensure /etc/cron.deny permissions if file exists
- name: Ensure /etc/cron.deny permissions if exists
  ansible.builtin.file:
    path: "{{ cron_deny_file }}"
    owner: root
    group: root
    mode: "{{ cron_deny_mode }}"
  when: cron_deny_status.stat.exists
  become: true

