- name: Ensure re-authentication for privilege escalation is not disabled globally
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^\s*Defaults\s+!authenticate\b'
    state: absent
    backup: true
    validate: '/usr/sbin/visudo -cf %s'

# 5.2.6 Ensure sudo authentication timeout is configured correctly
- name: Ensure sudo authentication timeout is configured correctly
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^#?\s*Defaults\s+timestamp_timeout='
    line: "Defaults timestamp_timeout={{ sudo_timeout }}"
    backup: true
    validate: '/usr/sbin/visudo -cf %s'

# Need change
# 5.2.7 Ensure access to the su command is restricted
- name: Restrict su command to wheel group
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    state: present
    regexp: '^#?\s*auth\s+required\s+pam_wheel.so\b'
    line: 'auth required pam_wheel.so use_uid group={{ su_group }}'

- name: Ensure wheel group exists (so the 'su' restriction has a group)
  ansible.builtin.group:
    name: "{{ su_group }}"
    state: present
  when: su_group is defined

- name: Check sudoers file syntax (final verification)
  ansible.builtin.command:
    cmd: /usr/sbin/visudo -cf /etc/sudoers
  changed_when: false
  failed_when: false
  register: visudo_final

- name: Fail if visudo reports errors
  ansible.builtin.fail:
    msg: "visudo reported errors: {{ visudo_final.stderr }}"
  when: visudo_final.rc != 0
