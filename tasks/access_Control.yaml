# 5.2.1 Ensure sudo is installed
- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

# 5.2.2 Ensure sudo commands use pty
- name: Ensure sudo commands use pty
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*Defaults\s+.*use_pty'
    line: 'Defaults use_pty'
    validate: '/usr/sbin/visudo -cf %s'

# 5.2.3 Ensure sudo log file exists
- name: Ensure sudo log file exists
  when: cis_Stage > 1
  block:
    - name: Ensure sudo log directory exists
      ansible.builtin.file:
        path: /var/log/sudo
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Ensure sudo logfile file exists
      ansible.builtin.copy:
        dest: /var/log/sudo/sudo.log
        content: ""
        owner: root
        group: root
        mode: '0640'

    - name: Configure sudo to log
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^#?\s*Defaults\s+logfile'
        line: 'Defaults logfile="/var/log/sudo/sudo.log"'

# 5.2.4 Ensure users must provide password for privilege escalation
# 5.2.5 Ensure re-authentication for privilege escalation is not disabled globally
- name: Remove lines with NOPASSWD tags in sudoers file
  ansible.builtin.replace:
    path: /etc/sudoers
    regexp: '^([^#].*NOPASSWD.*)$'
    replace: '# REMOVED_NOPASSWD: \1'
    backup: true
    validate: '/usr/sbin/visudo -cf %s'

