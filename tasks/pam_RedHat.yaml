- name: Ensure PAM packages are installed
  ansible.builtin.yum:
    name: "{{ item }}"
    state: latest
  with_items:
    - pam
    - libpwquality

# Ensure pam_faillock module is enabled
- name: Define PAM files to fix
  ansible.builtin.set_fact:
    pam_files:
      - /etc/pam.d/system-auth
      - /etc/pam.d/password-auth

- name: Ensure pam_faillock.so preauth line is below pam_env.so
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    insertafter: '^auth.*pam_env\.so'
    block: |
      auth        required      pam_faillock.so preauth silent audit deny=5 unlock_time=900 even_deny_root
  loop: "{{ pam_files }}"
  create: no
  backup: yes

- name: Ensure pam_faillock.so authfail line is before pam_succeed_if.so
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    insertbefore: '^auth.*pam_succeed_if\.so'
    block: |
      auth        [default=die] pam_faillock.so authfail audit deny=5 unlock_time=900 even_deny_root
  loop: "{{ pam_files }}"
  create: no
  backup: yes

- name: Ensure pam_faillock account line present
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^account\s+required\s+pam_faillock\.so'
    line: 'account required pam_faillock.so'
  loop: "{{ pam_files }}"
  create: no

- name: Ensure pam_pwquality is present in system-auth as requisite
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^\s*password\s+requisite\s+pam_pwquality\.so'
    line: 'password    requisite     pam_pwquality.so try_first_pass local_users_only retry=3'
  loop: "{{ pam_files }}"
  create: no

- name: Configure pwquality parameters (pwquality.conf)
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^{{ item.key }}'
    line: '{{ item.key }} = {{ item.value }}'
    create: yes
  loop:
    - { key: 'difok', value: '2' }
    - { key: 'minlen', value: '14' }
    - { key: 'minclass', value: '4' }
    - { key: 'maxrepeat', value: '3' }
    - { key: 'maxsequence', value: '3' }
    - { key: 'dictcheck', value: '1' }

- name: Ensure pam_pwhistory configured (remember and use_authtok + enforce_for_root)
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^password\s+required\s+pam_pwhistory\.so'
    line: 'password    required    pam_pwhistory.so remember=24 retry=3 enforce_for_root try_first_pass use_authtok'
  loop: "{{ pam_files }}"
  create: no
    
- name: Remove nullok from pam_unix lines if present
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '\bnullok\b'
    replace: ''
    backup: yes
  loop: "{{ pam_files }}"
  ignore_errors: true

- name: Remove remember= from pam_unix lines if present
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '\bremember=\d+\b'
    replace: ''
    backup: yes
  loop: "{{ pam_files }}"
  ignore_errors: true

- name: Ensure pam_unix uses sha512 and includes use_authtok
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^password\s+sufficient\s+pam_unix\.so.*$'
    replace: 'password    sufficient    pam_unix.so sha512 shadow try_first_pass use_authtok'
    backup: yes
  loop: "{{ pam_files }}"
  ignore_errors: true