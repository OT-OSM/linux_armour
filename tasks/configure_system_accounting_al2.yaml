# Ensure audit is installed

- name: "Ensure audit and audit-libs are installed"
  become: true
  ansible.builtin.package:
    name:
      - audit
      - audit-libs
    state: present

# Ensure auditing for processes that start prior to auditd is enabled

- name: "Ensure audit=1 exists in GRUB_CMDLINE_LINUX if missing"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="audit=1"'
  notify: update_grub

# Ensure audit_backlog_limit is sufficient

- name: "Ensure audit_backlog_limit is set"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="audit=1 audit_backlog_limit={{ audit_grub_backlog_limit }}"'
  notify: update_grub

# Ensure auditd.conf settings are configured

- name: "Configure auditd.conf parameters"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\\s*{{ item.key }}\\s*='
    line: '{{ item.key }} = {{ item.value }}'
  loop: "{{ audit_conf_settings }}"
  loop_control:
    label: "{{ item.key }}"

# Ensure auditd service is enabled

- name: "Ensure auditd is enabled and running"
  become: true
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  ignore_errors: true

# Ensure changes to system administration scope (sudoers) is collected

- name: "Create auditd rules for monitoring sudoers changes"
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-scope.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope

- name: "Load auditd rules using augenrules"
  become: true
  ansible.builtin.command: augenrules --load
  register: augenrules_output
  changed_when: "'No rules' not in augenrules_output.stderr"

- name: "Check if audit system is in locked mode and reboot may be required"
  become: true
  ansible.builtin.command: auditctl -s
  register: audit_status

- name: "Warn if auditd immutable mode is enabled (reboot required)"
  ansible.builtin.debug:
    msg: "Audit configuration is locked (enabled=2). A reboot is required to load new audit rules."
  when: audit_status.stdout is search('enabled 2')

# Ensure actions as another user are always logged

- name: "Create audit rule for logging actions executed as another user"
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-user-emulation.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F key=user_emulation
      -a always,exit -F arch=b32 -S execve -C uid!=euid -F key=user_emulation

- name: "Load auditd rules using augenrules"
  become: true
  ansible.builtin.command: augenrules --load
  register: augenrules_output
  changed_when: "'No rules' not in augenrules_output.stderr"

- name: "Check audit system status"
  become: true
  ansible.builtin.command: auditctl -s
  register: audit_status

- name: "Warn if auditd immutable mode is enabled (reboot required)"
  ansible.builtin.debug:
    msg: "Audit configuration is locked (enabled=2). A reboot is required to load new audit rules."
  when: audit_status.stdout is search('enabled 2')

# Ensure events that modify the sudo log file are collected

- name: "Detect sudo log file path from sudoers"
  become: true
  ansible.builtin.shell: |
    grep -r "^[[:space:]]*Defaults[[:space:]]\+logfile=" /etc/sudoers /etc/sudoers.d 2>/dev/null \
    | awk -F= '{print $2}' \
    | tr -d '"'
  register: sudo_logfile_raw
  changed_when: false

- name: "Set sudo log file path (default if none found)"
  ansible.builtin.set_fact:
    sudo_log_file: "{{ sudo_logfile_raw.stdout | default('/var/log/sudo.log') }}"

- name: "Create audit rule for sudo log file modification"
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-sudo-log.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -w {{ sudo_log_file }} -p wa -k sudo_log_file

- name: "Load auditd rules using augenrules"
  become: true
  ansible.builtin.command: augenrules --load
  register: augenrules_output
  changed_when: "'No rules' not in augenrules_output.stderr"

- name: "Check audit system status"
  become: true
  ansible.builtin.command: auditctl -s
  register: audit_status

- name: "Warn if auditd immutable mode is enabled (reboot required)"
  ansible.builtin.debug:
    msg: "Audit configuration is locked (enabled=2). A reboot is required to load new audit rules."
  when: audit_status.stdout is search('enabled 2')

# Ensure events that modify date and time information are collected

- name: Ensure audit rules directory exists
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: '0750'
  become: true

- name: Deploy time-change audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-time-change.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change
      -w /etc/localtime -p wa -k time-change
  become: true

- name: Load audit rules using augenrules
  ansible.builtin.command: augenrules --load
  become: true

- name: Check if reboot is required for time-change audit rules
  ansible.builtin.shell: |
    auditctl -s | grep "enabled" | grep -q "2" && echo "Reboot required" || echo "OK"
  register: timechange_reboot_required
  changed_when: false
  become: true

- name: Display reboot requirement for time-change rules
  ansible.builtin.debug:
    msg: >
      Audit rules loaded. 
      {{ "REBOOT REQUIRED (auditd immutable)" if "Reboot required" in timechange_reboot_required.stdout 
      else "No reboot required." }}

# Ensure events that modify the system's network environment are collected

- name: Ensure audit rules directory exists
  become: true
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy network modification audit rules
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-system-network.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/sysconfig/network -p wa -k system-locale
      -w /etc/sysconfig/network-scripts/ -p wa -k system-locale

- name: Load audit rules using augenrules
  become: true
  ansible.builtin.command: augenrules --load
  register: audit_network_load
  changed_when: "'No rules' not in audit_network_load.stderr"

- name: Check audit system immutability status
  become: true
  ansible.builtin.command: auditctl -s
  register: audit_network_status
  changed_when: false

- name: Warn if auditd immutable mode is enabled
  ansible.builtin.debug:
    msg: "Auditd is in immutable mode (enabled=2). Reboot required to apply network audit rules."
  when: audit_network_status.stdout is search('enabled 2')

# Ensure use of privileged commands are collected

- name: "Find privileged (SUID/SGID) commands"
  become: true
  ansible.builtin.shell: |
    find / -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null
  register: privileged_cmds_raw
  changed_when: false

- name: "Create audit rules file for privileged commands"
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-privileged.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for cmd in privileged_cmds_raw.stdout_lines %}
      -a always,exit -F path={{ cmd }} -F perm=x -F auid>=1000 -F auid!=unset -k privileged
      {% endfor %}

- name: "Load audit rules using augenrules"
  become: true
  ansible.builtin.command: augenrules --load
  register: privileged_rule_load
  changed_when: "'No rules' not in privileged_rule_load.stderr"

- name: "Check auditd immutable mode"
  become: true
  ansible.builtin.command: auditctl -s
  register: privileged_immutable
  changed_when: false

- name: "Warn if auditd immutable mode is enabled (reboot required)"
  ansible.builtin.debug:
    msg: "Auditd is in immutable mode (enabled=2). Reboot required to apply privileged command audit rules."
  when: privileged_immutable.stdout is search('enabled 2')

