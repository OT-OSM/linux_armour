# Ensure events that modify the system’s Mandatory Access Controls (MAC) are collected

- name: Ensure /etc/audit/rules.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy MAC policy audit rules
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-MAC-policy.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      # Audit SELinux attribute change syscalls
      -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -k MAC-policy
      -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -k MAC-policy

      # Audit SELinux policy directories
      -w /etc/selinux/ -p wa -k MAC-policy
      -w /usr/share/selinux/ -p wa -k MAC-policy

- name: Load audit rules using augenrules
  become: true
  ansible.builtin.command: augenrules --load
  register: mac_policy_load
  changed_when: "'No rules' not in mac_policy_load.stderr"

- name: Check auditd immutable mode
  become: true
  ansible.builtin.command: auditctl -s
  register: mac_policy_status
  changed_when: false

- name: Warn if auditd immutable mode = 2 (requires reboot)
  ansible.builtin.debug:
    msg: "Auditd is in immutable mode (enabled=2). Reboot required for MAC audit rules to take effect."
  when: mac_policy_status.stdout is search('enabled 2')

