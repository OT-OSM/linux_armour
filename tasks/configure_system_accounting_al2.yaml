# Ensure the audit configuration is immutable

- name: "Enable immutable audit configuration (-e 2)"
  become: true
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-immutable.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -e 2

- name: "Load audit rules"
  become: true
  ansible.builtin.command: augenrules --load
  changed_when: false

- name: "Check audit status for immutability"
  become: true
  ansible.builtin.command: auditctl -s
  register: audit_status
  changed_when: false

- name: "Notify that reboot is required"
  ansible.builtin.debug:
    msg: "Audit system is now immutable. A reboot is required for changes to take full effect."
  when: audit_status.stdout is search('enabled 2')

# Ensure running and on-disk audit configuration is the same (Manual)

- name: "Get running audit rules"
  become: true
  ansible.builtin.command: auditctl -l
  register: running_rules
  changed_when: false

- name: "Check on-disk audit rules integrity"
  become: true
  ansible.builtin.command: augenrules --check
  register: disk_rules
  changed_when: false

- name: "Show on-disk vs running audit rules comparison"
  ansible.builtin.debug:
    msg: "{{ disk_rules.stdout_lines }}"

# Ensure audit log directory is 0750 or more restrictive

- name: "Ensure audit log directory has correct permissions"
  become: true
  ansible.builtin.file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: '0750'

# Ensure audit log files are mode 0640 or less permissive

- name: "Ensure audit log files are 0640 or more restrictive"
  become: true
  ansible.builtin.shell: |
    find /var/log/audit -type f -exec chmod 0640 {} \;
  args:
    warn: false
  changed_when: false

- name: "Ensure audit log files are owned by root"
  become: true
  ansible.builtin.shell: |
    find /var/log/audit -type f -exec chown root:root {} \;
  args:
    warn: false
  changed_when: false

# Ensure only authorized users own audit log files

- name: "Ensure audit log files are owned by root user"
  become: true
  ansible.builtin.shell: |
    find /var/log/audit -type f ! -user root -exec chown root {} \;
  args:
    warn: false
  changed_when: false

# Ensure only authorized groups own audit log files

- name: "Ensure audit log files belong to the root group"
  become: true
  ansible.builtin.shell: |
    find /var/log/audit -type f ! -group root -exec chgrp root {} \;
  args:
    warn: false
  changed_when: false

# Ensure audit configuration files permissions are 0640 or more restrictive

- name: "Ensure audit configuration files have mode 0640 or more restrictive"
  become: true
  ansible.builtin.shell: |
    find /etc/audit -type f -exec chmod 0640 {} \;
  args:
    warn: false
  changed_when: false

# Ensure audit configuration files are owned by root

- name: "Ensure audit configuration files are owned by root"
  become: true
  ansible.builtin.shell: |
    find /etc/audit -type f ! -user root -exec chown root {} \;
  args:
    warn: false
  changed_when: false

# Ensure audit configuration files belong to group root

- name: "Ensure audit configuration files belong to group root"
  become: true
  ansible.builtin.shell: |
    find /etc/audit -type f ! -group root -exec chgrp root {} \;
  args:
    warn: false
  changed_when: false

# Ensure audit tools are 755 or more restrictive and root owned

- name: "Ensure audit tools are 755 and root-owned"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
    owner: root
    group: root
  loop: "{{ audit_tools }}"
  ignore_errors: true

