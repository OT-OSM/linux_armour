    # - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 0' }
    - { regexp: '^#?DisableForwarding', line: 'DisableForwarding yes' }
    # - { regexp: '^#?HostbasedAuthentication', line: 'HostbasedAuthentication no' }
    - { regexp: '^#?KexAlgorithms', line: 'KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1' }
