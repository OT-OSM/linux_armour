- name: Gather current mount information
  ansible.builtin.setup:
    filter: ansible_mounts

- name: Verify if /home is mounted on a separate partition
  ansible.builtin.set_fact:
    home_mount_found: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/home') | list | length > 0 }}"

- name: Report /home partition status
  ansible.builtin.debug:
    msg: >-
      {{
        '/home has a separate partition — compliant.'
        if home_mount_found
        else '/home is part of root filesystem — non-compliant. Create a separate partition manually.'
      }}
