---
#################################################
##### Configure Filesystems Kernel Modules ######
#################################################

- name: Disable unused or insecure filesystem kernel modules
  ansible.builtin.blockinfile:
    path: "/etc/modprobe.d/{{ item }}.conf"
    block: |
      install {{ item }} /bin/true
      blacklist {{ item }}
    create: true
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} {{ item }} module configuration"
  loop: >-
    {{
      (filesystem_kernel_modules.common | default([]))
      + (filesystem_kernel_modules.get(ansible_facts.os_family, []) | list)
    }}

#################################################
###### Configure Secure tmpfs Partitions ########
#################################################

- name: Ensure secure tmpfs mount directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "1777"
    owner: root
    group: root
  loop: "{{ secure_tmpfs_mounts }}"

- name: Ensure secure tmpfs mounts are active and persistent
  ansible.builtin.mount:
    path: "{{ item.path }}"
    src: "tmpfs"
    fstype: "tmpfs"
    opts: "{{ item.opts }}"
    state: mounted
  loop: "{{ secure_tmpfs_mounts }}"

