############################
# 1.3 Configure AppArmor #
############################

# 1.3.1.1 Ensure AppArmor is installed
- name: Ensure AppArmor is installed
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  register: apparmor_installed
  with_items:
    - apparmor
    - apparmor-utils
  until: apparmor_installed is succeeded
  when: ansible_os_family == "Debian"

# 1.3.1.2 Ensure AppArmor is enabled in the bootloader configuration
- name: Add AppArmor to GRUB_CMDLINE_LINUX
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    line: 'GRUB_CMDLINE_LINUX="apparmor=1 security=apparmor"'
    backup: yes
  register: grub_updated

- name: Update GRUB configuration
  ansible.builtin.command: update-grub
  when: grub_updated.changed

- name: Ensure all AppArmor profiles are enforcing
  ansible.builtin.shell: aa-enforce /etc/apparmor.d/*
  ignore_errors: true

############################
# 1.4 Configure BootLoader #
############################

# 1.4.1 Ensure bootloader password is set (Automated)
- name: Generate PBKDF2 password hash
  ansible.builtin.expect:
    command: grub-mkpasswd-pbkdf2
    responses:
      Enter password: "{{ root_password }}"
      Reenter password: "{{ root_password }}"
  register: password_hash

- name: Extract PBKDF2 hash
  ansible.builtin.set_fact:
    pbkdf2_hash: "{{ password_hash.stdout | regex_search('PBKDF2 hash of your password is (.*)', '\\1') | first }}"

- name: Debug PBKDF2 hash
  ansible.builtin.debug:
    var: pbkdf2_hash

- name: Update bootloader configuration
  ansible.builtin.blockinfile:
    path: /etc/grub.d/40_custom
    block: |
      set superusers="root"
      password_pbkdf2 root {{ pbkdf2_hash }}
    insertbefore: '^exit 0'
    create: yes
  notify: Update Grub Configuration

- name: Update Grub Configuration
  ansible.builtin.command: update-grub

# 1.4.2 Ensure permissions on bootloader config are configured
- name: Check if grub bootloader file exists
  ansible.builtin.stat:
    path: /boot/grub/grub.cfg
  register: grub_result

- name: Set permissions on grub configuration
  ansible.builtin.file:
    path: /boot/grub/grub.cfg
    owner: root
    group: root
    mode: "og-rwx"
    state: file
  when: grub_result.stat.exists

