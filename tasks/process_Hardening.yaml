---
## 1.5.1 Ensure address space layout randomization (ASLR) is enabled
- name: Set kernel.randomize_va_space
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: 2
    sysctl_set: true
    state: present
    reload: true

## 1.5.2 Ensure ptrace_scope is restricted 
- name: Restrict ptrace_scope
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: 2
    sysctl_set: true
    state: present
    reload: true

## 1.5.3 Ensure core dumps are restricted
- name: Restrict core dumps
  when: cis_Stage > 2
  block:
    - name: Check if systemd-coredump binary exists
      ansible.builtin.stat:
        path: /usr/lib/systemd/systemd-coredump
      register: coredump_bin

    - name: Configure core dump restriction using systemd
      when: coredump_bin.stat.exists
      block:
        - name: Ensure [Coredump] section exists
          ansible.builtin.lineinfile:
            path: /etc/systemd/coredump.conf
            regexp: '^\[Coredump\]'
            line: '[Coredump]'
            create: yes

        - name: Apply CIS coredump restrictions
          ansible.builtin.lineinfile:
            path: /etc/systemd/coredump.conf
            regexp: '^{{ item.key }}='
            line: '{{ item.key }}={{ item.value }}'
            insertafter: '^\[Coredump\]'
          loop:
            - { key: 'Storage', value: 'none' }
            - { key: 'ProcessSizeMax', value: '0' }
          notify: Reload systemd units

    - name: Configure fallback core dump restriction (non-systemd)
      when: not coredump_bin.stat.exists
      block:
        - name: Disable core dumps kernel-wide
          ansible.posix.sysctl:
            name: fs.suid_dumpable
            value: 0
            sysctl_set: true
            state: present
            reload: true

        - name: Restrict user core dump limits
          community.general.pam_limits:
            domain: '*'
            limit_type: hard
            limit_item: core
            value: 0

## 1.5.4 Ensure prelink is not installed
- name: Ensure prelink is not installed (Debian-based)
  when: cis_Stage > 2 and ansible_os_family == "Debian"
  block:
    - name: Check if prelink binary exists
      ansible.builtin.command: which prelink
      ignore_errors: true
      register: prelink_check
      changed_when: false

    - name: Disable prelinked binaries
      ansible.builtin.command: prelink -ua
      when: prelink_check.rc == 0
      changed_when: false

    - name: Ensure prelink is disabled for Debian System
      ansible.builtin.apt:
        name: prelink
        state: absent

## 1.5.5 Ensure Automatic Error Reporting is not enabled
- name: Ensure Automatic Error Reporting is disabled (Debian-based)
  ansible.builtin.apt:
    name: apport
    state: absent
  when: ansible_os_family == "Debian"
