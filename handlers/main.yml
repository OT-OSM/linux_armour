---
- name: Reload AIDE
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - aidecheck.timer
    - aidecheck

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart systemd-timesyncd
  ansible.builtin.service:
    name: systemd-timesyncd
    state: restarted

- name: Restart NTP
  ansible.builtin.service:
    name: ntp
    state: restarted

- name: Restart Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Update Grub Configuration
  ansible.builtin.command: update-grub

- name: Apply nftables ruleset
  ansible.builtin.command: nft -f /etc/nftables.conf

- name: Save iptables rules
  ansible.builtin.shell: /sbin/iptables-save > /etc/iptables/rules.v4
  args:
    executable: /bin/bash
  become: true

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart AIDE Timer
  ansible.builtin.systemd:
    name: aidecheck.timer
    state: restarted
    enabled: true
    daemon_reload: true
  become: true

