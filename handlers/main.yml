---
- name: Reload AIDE
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - aidecheck.timer
    - aidecheck

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart systemd-timesyncd
  ansible.builtin.service:
    name: systemd-timesyncd
    state: restarted

- name: Restart NTP
  ansible.builtin.service:
    name: ntp
    state: restarted

- name: Restart Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Update Grub Configuration
  ansible.builtin.command: update-grub

- name: Apply nftables ruleset
  ansible.builtin.command: nft -f /etc/nftables.conf

- name: Save iptables rules
  ansible.builtin.shell: /sbin/iptables-save > /etc/iptables/rules.v4
  args:
    executable: /bin/bash
  become: true

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
    
- name: update_grub
  become: true
  command: grub2-mkconfig -o /boot/grub2/grub.cfg

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart AIDE Timer
  ansible.builtin.systemd:
    name: aidecheck.timer
    state: restarted
    enabled: true
    daemon_reload: true
  become: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    
- name: Restart journald
  systemd:
    name: systemd-journald
    state: restarted
    
- name: Restart systemd-journal-upload
  ansible.builtin.service:
    name: systemd-journal-upload.service
    state: restarted

- name: yum_clean_metadata
  ansible.builtin.command:
    cmd: yum clean metadata
  changed_when: true

- name: yum_clean_all
  ansible.builtin.command:
    cmd: yum clean all
  changed_when: true

- name: patching_log
  ansible.builtin.debug:
    msg: "System packages updated successfully."

