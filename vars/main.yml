---
cis_Stage: 1

# FileSystem Directory Partition Location
# dir_partition:
#   - {path: "/var/tmp", device: "/dev/sda3",opts: "nodev,noexec,nosuid,remount"}
#   - {path: "/var/log", device: "/dev/sda",opts: "nodev,noexec,nosuid,remount"}
#   - {path: "/var/log/audit", device: "/dev/sda3",opts: "nodev,noexec,nosuid,remount"}
# #   # - {path: "/home", device: "/dev/xvda1",opts: "nodev,nosuid"}
# #   # - {path: "/var", device: "/dev/xvda1", opts: "nodev,nosuid"}

dir_partition:
  # - { path: "/home",           device: "/home",        opts: "bind,nodev,nosuid" }
  # - { path: "/var",           device: "/home",        opts: "bind,nodev,nosuid" }
  - { path: "/var/tmp",        device: "/var/tmp",        opts: "bind,nodev,noexec,nosuid" }
  - { path: "/var/log",        device: "/var/log",        opts: "bind,nodev,noexec,nosuid" }
  - { path: "/var/log/audit",  device: "/var/log/audit",  opts: "bind,nodev,noexec,nosuid" }


root_password: "Cis@123#"

sudo_timeout: 15

# Set the default time synchronization daemon
time_sync_daemon: systemd-timesyncd # Replace with one of in list ('chrony', 'systemd-timesyncd')

cron_service_name: "{{ 'crond' if ansible_os_family == 'RedHat' else 'cron' }}"

firewall_package: ufw
nftable_name: "my_nftables_rule"

# Ensure only one logging system is used.
preferred_logger: systemd-journald
# preferred_logger: rsyslog

System_File_Permissions:
  - host.conf
  - hostname
  - hosts
  - hosts.allow
  - hosts.deny
  - passwd
  - passwd-  
  - group
  - group-
  - shells

File_Permissions:
  - shadow
  - shadow-
  - gshadow
  - gshadow-

# opasswd file path
opasswd_file: /etc/security/opasswd
opasswd_old_file: /etc/security/opasswd.old

# Additional process hardening
cis_security_limits_filename: /etc/security/limits.conf

# remove packages with known issues
os_packages_clean: true
os_packages_list:
  - xinetd
  - inetd
  - ypserv
  - telnet-server
  - telnet-client
  - rsh-server
  - rsh-client
  - prelink
  - openldap-clients
  - openldap2-client
  - ldap-utils

# Audit
audit_package: 'auditd'
audit_package_centos: 'audit'
audit_rules_filename: "/etc/audit/audit.rules"

# Secure boot
sysconfig_init_filename: "/etc/sysconfig/init"
grub_bootloader_filename: "/boot/grub/menu.lst"

# Services needs to be disable
os_services_name: ['avahi-daemon', 'slapd', 'named', 'cups', 'telnet', 'discard-dgram', 'discard-stream']

# aide cronjob configuration
minute_aide_cronjob: '0'
hour_aide_cronjob: '5'

#Configure Additional Process Hardening
kernel_hardening_params:
  - { name: "kernel.randomize_va_space", value: "2", desc: "Ensure ASLR is enabled" }
  - { name: "kernel.yama.ptrace_scope", value: "1", desc: "Restrict ptrace_scope" }

coredump_config_block: |
  [Coredump]
  ProcessSizeMax=0
  Storage=none
#Configure privilege escalation
sudo_package: "sudo"
sudoers_path: "/etc/sudoers"
sudo_logfile_path: "/var/log/sudo.log"
timestamp_timeout_minutes: 15
su_group_name: "sugroup"
pam_su_path: "/etc/pam.d/su"
#User Accounts and Environment
pass_max_days: 365
pass_warn_age: 7
inactive_days: 30
tmout_value: 900
secure_umask: "0027"
# Configure job schedulers
cron_service: crond
cron_dirs:
  - /etc/cron.hourly
  - /etc/cron.daily
  - /etc/cron.weekly
  - /etc/cron.monthly
  - /etc/cron.d
cron_tab_file: /etc/crontab
cron_allow_file: /etc/cron.allow
cron_deny_file: /etc/cron.deny
at_files:
  - /etc/at.allow
  - /etc/at.deny
# Configure Pluggable Authentication Modules
pam_min_version: "1.1.8-23"
pam_deny_value: 5
pam_unlock_time: 900
pam_files:
  - /etc/pam.d/system-auth
  - /etc/pam.d/password-auth
pwquality_parameters:
  - { name: 'difok',       value: 2 }
  - { name: 'minlen',      value: 14 }
  - { name: 'maxrepeat',   value: 3 }
  - { name: 'maxsequence', value: 3 }
pam_pwhistory_remember: 24
#Configure Service Clients
insecure_service_clients:
  - ftp       # Ensure FTP client is not installed
  - ypbind    # Ensure NIS client is not installed
  - telnet    # Ensure Telnet client is not installed
  - tftp      # Ensure TFTP client is not installed
#Configure SELinux
selinux_packages:
  - libselinux
selinux_policy_type: targeted
selinux_mode: enforcing
unwanted_selinux_packages:
  - mcstrans
  - setroubleshoot
rescue_emergency_units:
  - rescue.service
  - emergency.service
# Configure Time Synchronization
chrony_amazon_timesync_block: |
  # Amazon Linux 2 default Chrony configuration
  server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
  pool 0.amazon.pool.ntp.org iburst maxsources 1
  pool 1.amazon.pool.ntp.org iburst maxsources 1
  pool 2.amazon.pool.ntp.org iburst maxsources 2

chrony_user_opts: 'OPTIONS="-u chrony"'

chrony_conf_path: "/etc/chrony.d/amazon_time_sync.conf"
chrony_service: "chronyd"
chrony_shell_check_path: "/etc/chrony.d"
# configure filesystem partitions for al2
tmp_mount_options:
  - { name: "Ensure /tmp is a separate partition", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }
  - { name: "Ensure nodev option set on /tmp", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }
  - { name: "Ensure nosuid option set on /tmp", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }
  - { name: "Ensure noexec option set on /tmp", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }

shm_mount_options:
  - { name: "Ensure /dev/shm is a separate partition", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }
  - { name: "Ensure nodev option set on /dev/shm", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }
  - { name: "Ensure nosuid option set on /dev/shm", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }
  - { name: "Ensure noexec option set on /dev/shm", opts: "defaults,rw,nosuid,nodev,noexec,relatime" }


