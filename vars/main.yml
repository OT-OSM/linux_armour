---
cis_Stage: 3

# FileSystem Directory Partition Location
# dir_partition:
#   - {path: "/var/tmp", device: "/dev/sda3",opts: "nodev,noexec,nosuid,remount"}
#   - {path: "/var/log", device: "/dev/sda",opts: "nodev,noexec,nosuid,remount"}
#   - {path: "/var/log/audit", device: "/dev/sda3",opts: "nodev,noexec,nosuid,remount"}
# #   # - {path: "/home", device: "/dev/xvda1",opts: "nodev,nosuid"}
# #   # - {path: "/var", device: "/dev/xvda1", opts: "nodev,nosuid"}
secure_tmpfs_mounts:
  - { path: /tmp,    opts: "nodev,nosuid,noexec" }
  - { path: /dev/shm, opts: "nodev,nosuid,noexec" }
dir_partition:
  # - { path: "/home",           device: "/home",        opts: "bind,nodev,nosuid" }
  # - { path: "/var",           device: "/home",        opts: "bind,nodev,nosuid" }
  - { path: "/var/tmp",        device: "/var/tmp",        opts: "bind,nodev,noexec,nosuid" }
  - { path: "/var/log",        device: "/var/log",        opts: "bind,nodev,noexec,nosuid" }
  - { path: "/var/log/audit",  device: "/var/log/audit",  opts: "bind,nodev,noexec,nosuid" }


grub_password_required: false # Set true for on-premise on console enabled servers only
root_password: "Cis@123#"

sudo_timeout: 15

su_group: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"

# Set the default time synchronization daemon
time_sync_daemon: chrony # Replace with one of in list ('chrony', 'systemd-timesyncd')

cron_service_name: "{{ 'crond' if ansible_os_family == 'RedHat' else 'cron' }}"

firewall_packages_by_os:
  Debian:
    - ufw
    - nftables
    - iptables
  RedHat:
    - firewalld
    - nftables
    - iptables
firewall_package: ufw
allowed_services:
  - ssh
  - http
  - https
  - dns

allowed_ports:
  - { port: "22", proto: "tcp" }
  - { port: "53", proto: "tcp" }
  - { port: "53", proto: "udp" }
  - { port: "80", proto: "tcp" }
  - { port: "443", proto: "tcp" }

nftable_name: "cis_benchmark_ruleset"

ssh_allow_users: []

ssh_banner_content: |
  ***********************************************************************
  * WARNING: Authorized access only!                                    *
  * Disconnect immediately if you are not an authorized user.           *
  * All activities may be monitored and recorded.                       *
  ***********************************************************************

ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3
ssh_max_auth_tries: 5
ssh_max_sessions: 10
ssh_max_startups: "10:30:60"
ssh_login_grace_time: 30

ssh_disable_forwarding: "yes"
ssh_gssapi_authentication: "no"
ssh_hostbased_authentication: "no"
ssh_ignore_rhosts: "yes"
ssh_permit_empty_passwords: "no"
ssh_permit_root_login: "no"
ssh_permit_user_environment: "no"
ssh_use_pam: "yes"
ssh_log_level: VERBOSE

ssh_kex_algorithms:
  - ecdh-sha2-nistp256
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp521
  - diffie-hellman-group-exchange-sha256
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group14-sha256

ssh_ciphers:
  - aes256-ctr,aes192-ctr,aes128-ctr

ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com

# Ensure only one logging system is used.
preferred_logger: systemd-journald
# preferred_logger: rsyslog

System_File_Permissions:
  - passwd
  - passwd-  
  - group
  - group-
  - shells

File_Permissions:
  - shadow
  - shadow-
  - gshadow
  - gshadow-

# opasswd file path
opasswd_file: /etc/security/opasswd
opasswd_old_file: /etc/security/opasswd.old

# Additional process hardening
cis_security_limits_filename: /etc/security/limits.conf

# remove packages with known issues
os_packages_clean: true
os_packages_list:
  - xinetd
  - inetd
  - ypserv
  - telnet-server
  - telnet-client
  - rsh-server
  - rsh-client
  - prelink
  - openldap-clients
  - openldap2-client
  - ldap-utils

# Audit
audit_package: 'auditd'
audit_package_centos: 'audit'
audit_rules_filename: "/etc/audit/audit.rules"

# Secure boot
sysconfig_init_filename: "/etc/sysconfig/init"
grub_bootloader_filename: "/boot/grub/menu.lst"

# Services needs to be disable
os_services_name: ['avahi-daemon', 'slapd', 'named', 'cups', 'telnet', 'discard-dgram', 'discard-stream']

# aide cronjob configuration
minute_aide_cronjob: '0'
hour_aide_cronjob: '5'
